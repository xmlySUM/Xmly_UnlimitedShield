# LivingEntity#dead is vanilla's "this entity has already run its death routine" re-entry guard.
# It is read in exactly one place - the `!this.dead` check at the top of LivingEntity#die() - and
# nothing else in the game looks at it. Opening it up lets the shield skip that death routine for
# entities that some mods can kill even though the Forge events were cancelled.
public net.minecraft.world.entity.LivingEntity f_20890_ # dead

# The synced health accessor, so the mixin can recognise a health read by identity instead of by
# guessing an index.
public net.minecraft.world.entity.LivingEntity f_20961_ # DATA_HEALTH_ID
